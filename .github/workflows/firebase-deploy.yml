name: Deploy BakeSync to Firebase Hosting

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Write service account key
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_OTPKREATIVE }}' > $HOME/service-account.json

      - name: Deploy to Firebase Hosting
        run: firebase deploy --only hosting --project otpkreative
        env:
          GOOGLE_APPLICATION_CREDENTIALS: $HOME/service-account.json
